<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогодняя Ёлка</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" v-if="isMounted">
        <div class="container">
            <!-- Звезда -->
            <div class="star" 
                 :style="{
                     animation: `twinkle ${starSpeed}ms infinite alternate`
                 }">
                ★
            </div>

            <!-- Ёлка из кружков -->
            <div class="tree">
                <div v-for="(row, rowIndex) in treeRows" 
                     :key="rowIndex" 
                     class="tree-row">
                    <div v-for="(ball, ballIndex) in row" 
                         :key="ballIndex" 
                         class="ball"
                         :style="{
                             backgroundColor: ball.color,
                             animation: `twinkle ${ball.speed}ms infinite alternate`,
                             animationDelay: `${ball.delay}ms`
                         }">
                    </div>
                </div>
            </div>

            <!-- Текст -->
            <div class="greeting">
                С Новым Годом!
            </div>
        </div>
    </div>

    <!-- Снежинки будут добавляться сюда -->
    <div id="snowflakes-container"></div>

    <script src="script.js"></script>
</body>
</html>
