<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10111c">
  <title>Привет, Семён!</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="formula-field" aria-hidden="true" id="formulaField"></div>

    <button class="theme-toggle" id="themeToggle" type="button"
            aria-label="Переключить цветовую тему" title="Переключить тему">
      <span class="theme-icon" aria-hidden="true">☀</span>
      <span class="theme-label">Светлая тема</span>
    </button>

    <section class="greeting" aria-label="Приветствие">
      <p class="eyebrow">Рады тебя видеть</p>
      <h1>Привет, Семён</h1>
      <p class="subtitle">Пусть сегодняшний день будет интересным.</p>
    </section>

    <div class="signature" aria-hidden="true">∞ &nbsp; ∑ &nbsp; π</div>
  </main>
</body>
</html>
